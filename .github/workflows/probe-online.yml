# Dritter Durchgang. Zwei Befunde stehen fest:
#   hit erhoeht immer nur um 1 (step/amount/by/value werden ignoriert),
#   /set gibt es ohne Verwalterschluessel nicht (308 auf die Doku).
# Damit ist abacus ein reiner Zaehler. Fuer den Entwurf fehlen noch drei
# harte Angaben, und die stehen am besten in der Doku selbst:
#   1. Verlaengert ein Zugriff die Haltbarkeit? (info sagt 4032 h)
#   2. Wie streng ist die Ratenbegrenzung?
#   3. Gibt es ein Sammel-Lesen, damit eine Verteilung nicht N Anfragen kostet?
#
# Geprueft wird hier, weil die Entwicklungsumgebung nur an Paketregister und
# GitHub kommt. Wird nach der Auswahl wieder entfernt.

name: Online-Speicher pruefen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Doku und Grenzen von abacus
        env:
          ORIGIN: https://cauer71.github.io
          NS: zp-probe3
        run: |
          set -u
          A=https://abacus.jasoncameron.dev
          NSX="$NS-$GITHUB_RUN_ID"

          zeig() {
            local name="$1"; shift
            echo "--- $name"
            code=$(curl -sS -m 20 -o /tmp/body -D /tmp/head -w '%{http_code}' \
                    -H "Origin: $ORIGIN" "$@" || echo 000)
            echo "    HTTP $code"
            grep -iE '^(access-control-allow-origin|x-ratelimit|ratelimit|retry-after):' /tmp/head \
              | tr -d '\r' | sed 's/^/    /'
            echo -n "    "; head -c 500 /tmp/body | tr -d '\r'; echo
          }

          echo "=== 1. Die Doku im Klartext ==="
          curl -sS -m 25 -L https://jasoncameron.dev/abacus/ -o /tmp/doku.html \
            -w 'HTTP %{http_code}, %{size_download} Bytes\n' || true
          # Auszeichnung entfernen, damit der Text lesbar im Protokoll steht.
          python3 - <<'PY'
          import re, html, pathlib
          p = pathlib.Path('/tmp/doku.html')
          if not p.exists() or not p.stat().st_size:
              print('    keine Doku geladen'); raise SystemExit
          s = p.read_text('utf-8', 'replace')
          s = re.sub(r'(?is)<(script|style|nav|footer|svg)[^>]*>.*?</\1>', ' ', s)
          s = re.sub(r'(?i)<br\s*/?>|</(p|div|li|h[1-6]|tr|pre)>', '\n', s)
          s = re.sub(r'<[^>]+>', ' ', s)
          s = html.unescape(s)
          zeilen = [re.sub(r'[ \t]+', ' ', z).strip() for z in s.split('\n')]
          zeilen = [z for z in zeilen if z]
          print('    ' + '\n    '.join(zeilen[:400]))
          PY

          echo
          echo "=== 2. Maschinenlesbare Beschreibung? ==="
          for pfad in /docs /openapi.json /swagger.json /docs/openapi.json /healthcheck; do
            zeig "$pfad" "$A$pfad"
          done

          echo
          echo "=== 3. Verlaengert ein Zugriff die Haltbarkeit? ==="
          zeig "hit (legt an)"  "$A/hit/$NSX/haltbarkeit"
          zeig "info sofort"    "$A/info/$NSX/haltbarkeit"
          sleep 12
          zeig "info +12 s"     "$A/info/$NSX/haltbarkeit"
          zeig "hit nochmal"    "$A/hit/$NSX/haltbarkeit"
          zeig "info danach"    "$A/info/$NSX/haltbarkeit"

          echo
          echo "=== 4. Ratenbegrenzung: 60 Anfragen so schnell wie moeglich ==="
          fehler=0; erste_kopf=""
          for i in $(seq 1 60); do
            c=$(curl -sS -m 10 -o /dev/null -D /tmp/rh -w '%{http_code}' \
                  -H "Origin: $ORIGIN" "$A/hit/$NSX/rate" || echo 000)
            if [ "$i" = 1 ]; then
              erste_kopf=$(grep -iE '^(x-)?ratelimit' /tmp/rh | tr -d '\r' | tr '\n' ' ')
            fi
            case "$c" in 200) ;; *) fehler=$((fehler+1)); echo "    Anfrage $i: HTTP $c";
              grep -iE '^(retry-after|(x-)?ratelimit)' /tmp/rh | tr -d '\r' | sed 's/^/      /' ;; esac
          done
          echo "    60 Anfragen, davon nicht 200: $fehler"
          echo "    Ratenkopfzeilen der ersten: ${erste_kopf:-keine}"
          zeig "Endstand" "$A/get/$NSX/rate"

          echo
          echo "=== 5. Sammel-Lesen? ==="
          for pfad in "/get/$NSX" "/list/$NSX" "/keys/$NSX" "/get/$NSX/a,b" "/getall/$NSX"; do
            zeig "$pfad" "$A$pfad"
          done

          echo
          echo "=== 6. Setzen mit Verwalterschluessel (nur zur Kenntnis) ==="
          neu=$(curl -sS -m 20 -H "Origin: $ORIGIN" "$A/create/$NSX/gesetzt")
          echo "    create: $neu"
          AK=$(printf '%s' "$neu" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("admin_key",""))')
          for v in "POST /set" "PUT /set" "POST /update"; do
            m=${v%% *}; p=${v##* }
            echo "--- $v"
            curl -sS -m 20 -o /tmp/b -D /tmp/h -X "$m" -H "Origin: $ORIGIN" \
              -H 'Content-Type: application/json' \
              "$A$p/$NSX/gesetzt?admin_key=$AK&value=8000" \
              -w '    HTTP %{http_code}\n' || true
            echo -n "    "; head -c 300 /tmp/b | tr -d '\r'; echo
          done
          zeig "get danach" "$A/get/$NSX/gesetzt"

          echo
          echo "========== fertig =========="
