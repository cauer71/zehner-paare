# Vierter und letzter Durchgang. Der Entwurf steht, er haengt aber an einer
# einzigen Zusage aus der Doku, die ich noch nicht selbst gesehen habe:
#
#   GET /create/:ns/:key?initializer=8450  ->  201 {"value": 8450}
#
# Wenn das ohne Schluessel wirklich geht, kann ein Browser einen EXAKTEN Wert
# ablegen, obwohl der Dienst nur "plus eins" kennt: ein Zaehler zeigt auf die
# laufende Nummer des Rekords, und jede Nummer ist ein eigener, einmalig
# angelegter Schluessel mit dem Punktestand als Startwert.
#
# Gepruefte Fakten aus den ersten drei Durchgaengen, damit sie nicht verloren
# gehen: hit erhoeht immer nur um 1; /set, /reset, /update, /delete brauchen
# den Verwalterschluessel; Schluessel leben 6 Monate ab Anlage und ein Zugriff
# verlaengert das NICHT (die Doku behauptet das Gegenteil, gemessen ist es
# nicht so); Grenze sind 30 Anfragen je 10 Sekunden je Adresse; CORS ist
# vollstaendig offen, auch die Vorabanfrage.
#
# Wird nach diesem Durchgang entfernt.

name: Online-Speicher pruefen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Startwert beim Anlegen
        env:
          ORIGIN: https://cauer71.github.io
          NS: zp-probe4
        run: |
          set -u
          A=https://abacus.jasoncameron.dev
          NSX="$NS-$GITHUB_RUN_ID"

          zeig() {
            local name="$1"; shift
            echo "--- $name"
            code=$(curl -sS -m 20 -o /tmp/body -D /tmp/head -w '%{http_code}' \
                    -H "Origin: $ORIGIN" "$@" || echo 000)
            echo "    HTTP $code"
            grep -iE '^(access-control-expose-headers|ratelimit-remaining):' /tmp/head \
              | tr -d '\r' | sed 's/^/    /'
            echo -n "    "; head -c 300 /tmp/body | tr -d '\r'; echo
            sleep 0.4          # unter der Grenze von 30 je 10 s bleiben
          }

          echo "=== 1. Traegt der Startwert? ==="
          zeig "create ?initializer=8450" "$A/create/$NSX/best-mittel-v1?initializer=8450"
          zeig "get"                      "$A/get/$NSX/best-mittel-v1"
          zeig "info"                     "$A/info/$NSX/best-mittel-v1"

          echo
          echo "=== 2. Zweimal anlegen aendert nichts? ==="
          zeig "create nochmal, 1"        "$A/create/$NSX/best-mittel-v1?initializer=1"
          zeig "get danach"               "$A/get/$NSX/best-mittel-v1"

          echo
          echo "=== 3. Was sagt get zu einem Schluessel, den es nie gab? ==="
          zeig "get unbekannt"            "$A/get/$NSX/gibt-es-nicht"
          zeig "info unbekannt"           "$A/info/$NSX/gibt-es-nicht"

          echo
          echo "=== 4. Der Zeiger auf die laufende Nummer ==="
          zeig "hit gen (neu)"            "$A/hit/$NSX/best-mittel-gen"
          zeig "hit gen"                  "$A/hit/$NSX/best-mittel-gen"
          zeig "get gen"                  "$A/get/$NSX/best-mittel-gen"

          echo
          echo "=== 5. Grenzen des Startwerts ==="
          zeig "gross (99999999)"         "$A/create/$NSX/gross?initializer=99999999"
          zeig "krumm (abc)"              "$A/create/$NSX/krumm?initializer=abc"
          zeig "negativ (-5)"             "$A/create/$NSX/negativ?initializer=-5"
          zeig "get negativ"              "$A/get/$NSX/negativ"

          echo
          echo "=== 6. Sieht ein Browser die Grenz-Kopfzeilen? ==="
          echo "--- OPTIONS auf create"
          curl -sS -m 20 -o /dev/null -D /tmp/h -X OPTIONS \
            -H "Origin: $ORIGIN" -H 'Access-Control-Request-Method: GET' \
            "$A/create/$NSX/egal" -w '    HTTP %{http_code}\n' || true
          grep -iE '^access-control-' /tmp/h | tr -d '\r' | sed 's/^/    /' || echo "    keine"

          echo
          echo "========== fertig =========="
