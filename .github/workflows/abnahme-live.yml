# Abnahme der veroeffentlichten Seite gegen die echte Datenbank.
#
# Warum auf einem Laeufer: die Entwicklungsumgebung kommt weder an
# 10.auer.page noch an cauer71.github.io (der Proxy weist beides mit 403 ab).
# Hier laeuft ein echter Browser auf der echten Seite.
#
# BEWUSST NUR LESEN. Ein Schreibruf wuerde die Weltzahlen mit einer Partie
# fuellen, die niemand gespielt hat, und womoeglich einen Weltrekord auf einen
# Botwert setzen. Geprueft wird darum: laedt die Seite, ist es die neue
# Fassung, antwortet die Schnittstelle, steht der Weltrekord im Spielfeld -
# und ist der Bestand danach unveraendert.
#
# Zwei Adressen, weil das Spiel an zwei Orten liegt: auf 10.auer.page holt es
# die Zahlen von sich selbst, auf GitHub Pages ueber Kreuz von 10.auer.page.
# Der zweite Fall haengt an einem CORS-Kopf und faellt sonst still aus.

name: Abnahme der fertigen Seite

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      SEITE: https://10.auer.page/
      PAGES: https://cauer71.github.io/zehner-paare/
    steps:
      - uses: actions/checkout@v4

      - name: Liegt die neue Fassung wirklich dort?
        run: |
          set -u
          for ort in "$SEITE" "$PAGES"; do
            echo "$ort"
            for datei in "" app.js online.js i18n.js sw.js manifest.de.webmanifest; do
              code=$(curl -sS -m 20 -o /tmp/d -w '%{http_code}' "$ort$datei" || echo 000)
              echo "  $code  ${datei:-index.html}  $(wc -c < /tmp/d) Bytes"
            done
            echo -n "  Fassung: "
            curl -sS -m 20 "$ort/app.js" | grep -m1 "export const VERSION" || echo "NICHT GEFUNDEN"
          done
          echo
          echo "Der Servercode darf nicht ausgeliefert werden:"
          code=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$SEITE/worker.js" || echo 000)
          echo "  $code  /worker.js  (404 erwartet)"
          test "$code" = "404"

      - name: Der Bestand vor der Pruefung
        run: |
          set -u
          curl -sS -m 20 "$SEITE/api/welt" | tee /tmp/vorher.json
          echo
          # Ein CORS-Kopf muss dabei sein, sonst kommt die Pages-Fassung nicht
          # an ihre Zahlen.
          curl -sS -m 20 -D - -o /dev/null "$SEITE/api/welt" | grep -i 'access-control-allow-origin'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regeltests gegen den ausgecheckten Stand
        run: npm test

      - name: Browser holen
        run: |
          npm i --no-save --silent playwright-core@1.49.1
          npx --yes playwright@1.49.1 install --with-deps chromium

      - name: Echter Browser auf beiden Adressen
        run: |
          cat > live.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import { execSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';

          // Die erwartete Fassung steht nicht hier, sondern in der Quelle des
          // gerade ausgecheckten Stands: eine fest eingetippte Nummer haette
          // beim naechsten Versionssprung falschen Alarm gegeben.
          const sollFassung = readFileSync('app.js', 'utf8')
            .match(/VERSION = '([^']+)'/)?.[1] ?? null;
          console.log('Erwartete Fassung:', sollFassung);

          const pfad = execSync(
            'find /home/runner/.cache/ms-playwright -name chrome -type f | head -1',
            { encoding: 'utf8' }).trim();
          const browser = await chromium.launch(pfad ? { executablePath: pfad } : {});
          const probleme = [];

          for (const [wo, adresse] of [['eigene Seite', process.env.SEITE],
                                       ['GitHub Pages', process.env.PAGES]]) {
            console.log(`\n=== ${wo}: ${adresse} ===`);
            const ctx = await browser.newContext({ viewport: { width: 390, height: 844 },
              deviceScaleFactor: 1, isMobile: true, hasTouch: true });
            // Vor dem ersten Laden gesetzt, nicht danach mit einem Neuladen:
            // sonst holt der erste Aufruf die Weltzahlen, der zweite nimmt sie
            // aus dem Merkzettel, und "genau ein Leseruf" waere nur Zufall.
            await ctx.addInitScript(`localStorage.setItem('zp.seen.v1','true');`);
            const page = await ctx.newPage();

            const fehler = [];
            const rufe = [];
            page.on('pageerror', (e) => fehler.push('pageerror: ' + e.message));
            page.on('console', (m) => { if (m.type() === 'error') fehler.push('console: ' + m.text()); });
            page.on('response', (r) => {
              if (r.url().includes('/api/')) rufe.push(`${r.request().method()} ${r.status()} ${r.url()}`);
            });

            await page.goto(adresse, { waitUntil: 'load' });
            await page.waitForTimeout(4000);

            const sicht = await page.evaluate(() => ({
              fassung: window.__zp?.VERSION ?? null,
              welt: document.getElementById('stat-world')?.textContent?.trim(),
              felder: document.querySelectorAll('.cell').length,
              merkzettel: localStorage.getItem('zp.welt.v1'),
            }));
            console.log('  Fassung im Spiel:', sicht.fassung);
            console.log('  Weltrekord im Feld:', JSON.stringify(sicht.welt));
            console.log('  Felder auf dem Brett:', sicht.felder);
            console.log('  Merkzettel:', sicht.merkzettel);
            console.log('  Rufe:', rufe.length ? rufe.join('\n         ') : 'keiner');
            console.log('  Seitenfehler:', fehler.length ? fehler.join(' | ') : 'keine');

            await page.screenshot({ path: `live-${wo.replace(/\W+/g, '-')}.png` });
            await ctx.close();

            if (sollFassung && sicht.fassung !== sollFassung)
              probleme.push(`${wo}: Fassung ${sicht.fassung}, erwartet ${sollFassung}`);
            if (!sicht.felder) probleme.push(`${wo}: kein Spielfeld`);
            // Beim Start genau ein Lesen - und kein einziges Schreiben.
            const lesen = rufe.filter((r) => r.startsWith('GET'));
            const schreiben = rufe.filter((r) => !r.startsWith('GET') && !r.startsWith('OPTIONS'));
            if (lesen.length !== 1) probleme.push(`${wo}: ${lesen.length} Leserufe statt einem`);
            if (schreiben.length) probleme.push(`${wo}: es wurde geschrieben - ${schreiben.join(', ')}`);
            if (lesen.some((r) => / [45]\d\d /.test(r))) probleme.push(`${wo}: Schnittstelle antwortete mit Fehler`);
            if (!/\d/.test(sicht.welt ?? '')) probleme.push(`${wo}: keine Weltzahl im Spielfeld`);
            if (fehler.length) probleme.push(`${wo}: ${fehler.join(' | ')}`);
          }

          await browser.close();
          console.log('\n=== Probleme ===');
          console.log(probleme.length ? probleme.join('\n') : 'keine');
          process.exit(probleme.length ? 1 : 0);
          JS
          node live.mjs

      - name: Der Bestand nach der Pruefung - muss derselbe sein
        if: always()
        run: |
          set -u
          curl -sS -m 20 "$SEITE/api/welt" > /tmp/nachher.json
          cat /tmp/nachher.json; echo
          if diff -q /tmp/vorher.json /tmp/nachher.json >/dev/null; then
            echo "unveraendert"
          else
            echo "VERAENDERT. Entweder hat die Abnahme geschrieben - dann ist das"
            echo "ein Fehler - oder jemand hat waehrenddessen wirklich gespielt."
            diff /tmp/vorher.json /tmp/nachher.json || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-bestwerte
          path: live-*.png
          if-no-files-found: ignore
