name: Zehner-Paare auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Regeltests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Spiellogik, Woerterbuecher und die Grenze zur Datenbank testen
        run: npm test

  deploy:
    name: Veröffentlichen
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Pages einrichten
        uses: actions/configure-pages@v5
        with:
          enablement: true
      # Das ganze Repo hochladen, nicht nur den Spielordner: dann liefert der
      # Workflow dieselben Adressen aus wie die Branch-Variante von Pages
      # (Wurzel leitet auf zehner-paare/ weiter), egal welche gerade aktiv ist.
      - name: Seite als Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deployment
        id: deployment
        uses: actions/deploy-pages@v4
