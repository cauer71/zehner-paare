name: Zehner-Paare auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
    paths:
      - 'zehner-paare/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Regeltests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Spiellogik testen
        run: node --test zehner-paare/game.test.js

  deploy:
    name: Veröffentlichen
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Pages einrichten
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Spielordner als Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: zehner-paare
      - name: Deployment
        id: deployment
        uses: actions/deploy-pages@v4
